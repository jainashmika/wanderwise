# Render Blueprint for WanderWise Full-Stack Smart Travel Planner
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: wanderwise-travel-planner
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        sync: false
        # Example: jdbc:mysql://YOUR_CLOUD_DB_HOST:3306/smart_travel_planner?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
        # Example: admin
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
        # Example: your_secure_db_password
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: none

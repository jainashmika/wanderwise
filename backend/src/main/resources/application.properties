# ============================================================
#  application.properties
#  This file configures how Spring Boot connects to MySQL.
#  IMPORTANT: Change the password to YOUR MySQL root password.
# ============================================================

# --- MySQL Connection ---
spring.datasource.url=jdbc:mysql://localhost:3306/smart_travel_planner?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=ashmika06

# --- JPA / Hibernate Settings ---
# "validate" means: just validate existing schema, don't modify it
spring.jpa.hibernate.ddl-auto=validate
# Shows the SQL queries in the console (helpful for learning/debugging)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Server ---
server.port=8080

# ============================================================
#  application.properties
#  This file configures how Spring Boot connects to MySQL.
#  IMPORTANT: Change the password to YOUR MySQL root password.
# ============================================================

# --- MySQL Connection ---
spring.datasource.url=jdbc:mysql://localhost:3306/smart_travel_planner?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=ashmika06

# --- JPA / Hibernate Settings ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Shows the SQL queries in the console (helpful for learning/debugging)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Server ---
server.port=8085

